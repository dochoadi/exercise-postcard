!DOCTYPE html>
<!-- Prueba de entrega de práctica - Probando Comandos -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Postcard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <main class="postcard">
 
    <h1 class="postcard__title">My Postcard</h1>
 
    <div class="postcard__logo">
      <img src="https://storage.googleapis.com/breathecode-asset-images/5318bde604cf5c915f94897a71b49ab2523101322ea21cb046db1e67c24fa3be.png" alt="4Geeks Academy logo">
    </div>
 
    <div class="postcard__text">
      <p>Look how awesome! This is a postcard that I created using HTML5 and CSS3 during my 4Geeks Academy Course!</p>
      <p>This is so cool, can't wait to start doing more stuff!</p>
    </div>
 
    <form class="postcard__form">
      <input type="text" placeholder="Some Name">
      <input type="email" placeholder="Some Email">
      <input type="text" placeholder="Some comment">
    </form>
 
    <button type="submit" class="postcard__button">Send My Postcard</button>
 
  </main>
 
</body>
</html>
